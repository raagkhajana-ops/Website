<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" preserveAspectRatio="xMidYMid slice">
  <title>Illuminated Gurmukhi manuscript motif in royal blue and gold</title>
  <defs>
    <pattern id="arches" width="34" height="30" patternUnits="userSpaceOnUse">
      <path d="M2 28 C2 12, 12 4, 17 2 C22 4, 32 12, 32 28" fill="none" stroke="#c9a13b" stroke-width="1.2" opacity="0.55"/>
    </pattern>
    <g id="diamond">
      <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="#c9a13b"/>
    </g>
  </defs>

  <rect width="1240" height="420" fill="#1f3a7a"/>

  <!-- double manuscript frame -->
  <rect x="26" y="26" width="1188" height="368" fill="none" stroke="#c9a13b" stroke-width="1.5"/>
  <rect x="38" y="38" width="1164" height="344" fill="none" stroke="#c9a13b" stroke-width="1" opacity="0.5"/>

  <!-- arch bands, top and bottom -->
  <rect x="52" y="52" width="1136" height="30" fill="url(#arches)"/>
  <rect x="52" y="338" width="1136" height="30" fill="url(#arches)"/>

  <!-- central medallion -->
  <circle cx="620" cy="210" r="78" fill="none" stroke="#c9a13b" stroke-width="1.5"/>
  <circle cx="620" cy="210" r="62" fill="none" stroke="#c9a13b" stroke-width="1" opacity="0.55"/>
  <use href="#diamond" x="620" y="210"/>
  <circle cx="620" cy="132" r="3.5" fill="#faf7f1" opacity="0.9"/>
  <circle cx="620" cy="288" r="3.5" fill="#faf7f1" opacity="0.9"/>
  <circle cx="542" cy="210" r="3.5" fill="#faf7f1" opacity="0.9"/>
  <circle cx="698" cy="210" r="3.5" fill="#faf7f1" opacity="0.9"/>

  <!-- horizontal rules with diamond terminals -->
  <line x1="90" y1="210" x2="510" y2="210" stroke="#c9a13b" stroke-width="1" opacity="0.55"/>
  <line x1="730" y1="210" x2="1150" y2="210" stroke="#c9a13b" stroke-width="1" opacity="0.55"/>
  <use href="#diamond" x="90" y="210" opacity="0.85"/>
  <use href="#diamond" x="1150" y="210" opacity="0.85"/>
</svg>
