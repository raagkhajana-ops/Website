<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" preserveAspectRatio="xMidYMid slice">
  <title>A gurmat sangeet teacher and student</title>
  <defs>
    <pattern id="about-arches" width="30" height="26" patternUnits="userSpaceOnUse">
      <path d="M2 24 C2 10, 10 4, 15 2 C20 4, 28 10, 28 24" fill="none" stroke="#1f3a7a" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="680" height="340" fill="#f1ead9"/>

  <!-- double frame in blue -->
  <rect x="20" y="20" width="640" height="300" fill="none" stroke="#1f3a7a" stroke-width="1.5"/>
  <rect x="30" y="30" width="620" height="280" fill="none" stroke="#1f3a7a" stroke-width="1" opacity="0.45"/>

  <!-- arch band along the bottom -->
  <rect x="42" y="278" width="596" height="26" fill="url(#about-arches)"/>

  <!-- medallion: two overlapping circles, teacher and student -->
  <circle cx="300" cy="160" r="64" fill="none" stroke="#1f3a7a" stroke-width="1.5"/>
  <circle cx="386" cy="176" r="46" fill="none" stroke="#1f3a7a" stroke-width="1.2" opacity="0.7"/>
  <rect x="334" y="158" width="11" height="11" transform="rotate(45 339.5 163.5)" fill="#c9a13b"/>

  <!-- gold accent rules -->
  <line x1="56" y1="160" x2="216" y2="160" stroke="#c9a13b" stroke-width="1.2" opacity="0.8"/>
  <line x1="464" y1="160" x2="624" y2="160" stroke="#c9a13b" stroke-width="1.2" opacity="0.8"/>
  <circle cx="56" cy="160" r="3" fill="#c9a13b"/>
  <circle cx="624" cy="160" r="3" fill="#c9a13b"/>
</svg>
